name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"

jobs:
  test:
    name: Tests and architecture boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install workspace tool dependencies
        env:
          RIPGREP_VERSION: "14.1.1"
          RIPGREP_SHA256: "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e"
        run: |
          archive="${RUNNER_TEMP}/ripgrep.tar.gz"
          install_dir="${RUNNER_TEMP}/ripgrep-bin"
          curl --fail --location --silent --show-error \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${RIPGREP_SHA256}" "${archive}" | sha256sum --check -
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}"
          mkdir --parents "${install_dir}"
          install --mode 0755 \
            "${RUNNER_TEMP}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl/rg" \
            "${install_dir}/rg"
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Verify dependency boundaries
        run: >-
          go test ./internal/architecture
          -run 'TestNoGoWorkFilesInRepository|TestNoLocalModuleReplacementWiring|TestNoRedevenDependencyWiring'
          -count=1

      - name: Run repository tests and OKF conformance
        run: go test ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Exercise public conformance helpers
        run: go test ./florettest

      - name: Enforce the v6 public API baseline
        run: scripts/check_v6_api_compatibility.sh

      - name: Compile a blank downstream module from the proposed v6 module zip
        run: scripts/check_candidate_release_adoption.sh

      - name: Compile and run public examples
        shell: bash
        run: |
          go test ./cmd/examples/...
          go run ./cmd/examples/quick-start

  race:
    name: Focused race detection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Exercise concurrent runtime and Store boundaries
        run: >-
          go test -race
          ./internal/engine
          ./internal/agentharness
          ./internal/sessiontree
          ./storage
          ./runtime
          ./tools

  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan reachable dependencies
        run: govulncheck ./...
