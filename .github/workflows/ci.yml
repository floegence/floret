name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"

jobs:
  test:
    name: Tests and architecture boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install workspace tool dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Verify dependency boundaries
        run: >-
          go test ./internal/architecture
          -run 'TestNoGoWorkFilesInRepository|TestNoLocalModuleReplacementWiring|TestNoRedevenDependencyWiring'
          -count=1

      - name: Run repository tests and OKF conformance
        run: go test ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Exercise public conformance helpers
        run: go test ./florettest

      - name: Enforce the v3 public API baseline
        run: scripts/check_v3_api_compatibility.sh

      - name: Compile a blank downstream module from the proposed v3 module zip
        run: scripts/check_candidate_release_adoption.sh

      - name: Compile and run public examples
        shell: bash
        run: |
          go test ./cmd/examples/...
          go run ./cmd/examples/quick-start

  race:
    name: Focused race detection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Exercise concurrent runtime and Store boundaries
        run: >-
          go test -race
          ./internal/engine
          ./internal/agentharness
          ./internal/sessiontree
          ./storage
          ./runtime
          ./tools

  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan reachable dependencies
        run: govulncheck ./...
