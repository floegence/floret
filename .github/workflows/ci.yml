name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GOWORK: "off"
jobs:
  test:
    name: Tests and architecture boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check dependency and gate boundaries
        run: go test ./internal/architecture -run 'TestNoGoWorkFilesInRepository|TestNoLocalModuleReplacementWiring|TestNoRedevenDependencyWiring|TestCIGatesUseCurrentMajor' -count=1
      - name: Check generated model catalog
        run: |
          python3 scripts/model-catalog/test_generate.py
          python3 scripts/model-catalog/generate.py --check
      - name: Smoke test the public API
        run: go test ./florettest ./cmd/examples/quick-start
